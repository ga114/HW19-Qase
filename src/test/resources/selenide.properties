# Базовый URL
selenide.baseUrl=https://www.app.qase.io

# Браузер и настройки
browser=chrome
headless=false
browserSize=1920x1080
holdBrowserOpen=false

# Скриншоты при падении [[25]]
selenide.screenshots=true
selenide.timeout=10000
selenide.reportsFolder=build/reports/tests
screenshots=true
savePageSource=false

# Allure интеграция
allure.link.issue.pattern=https://qase.io/issue/{}
allure.link.tms.pattern=https://qase.io/test/{}